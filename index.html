<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lời Tỏ Tình Bất Ngờ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        #start-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <button id="start-btn">Nhấn vào đây ❤️</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');

        let dpr = window.devicePixelRatio || 1;
        let width = window.innerWidth;
        let height = window.innerHeight;

        // Cấu hình lại Canvas hỗ trợ màn hình độ phân giải cao (Retina/OLED mobile) giúp chữ nét căng
        function setupCanvas() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        setupCanvas();
        window.addEventListener('resize', setupCanvas);

        // Danh sách thông điệp hiển thị
        const messages = [
            "3",
            "2",
            "1",
            "Anh thật sự thích em",
            "Anh muốn yêu em nghiêm túc",
            "Em đồng ý...",
            "Làm người yêu anh nhé"
        ];

        let msgIndex = 0;
        let state = 'IDLE'; // MATRIX, TEXT, HEART
        let matrixDrops = [];
        const chars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ@#$%&*";

        function initMatrix() {
            const columns = Math.floor(width / 18);
            matrixDrops = [];
            for (let i = 0; i < columns; i++) {
                matrixDrops[i] = Math.random() * -50;
            }
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            ctx.font = '15px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * 18;
                const y = matrixDrops[i] * 18;

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // Tạo hạt hiển thị chữ sắc nét bằng canvas ẩn
        let particles = [];
        function createTextParticles(text) {
            particles = [];
            
            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            const offCtx = offscreen.getContext('2d');

            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, width, height);

            // Tự động tính kích thước chữ phù hợp màn hình điện thoại
            let fontSize = Math.min(width / (text.length * 0.75), 45);
            if (text.length <= 2) fontSize = 80; // Số đếm 3 2 1

            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const step = Math.max(2, Math.floor(width / 220)); // Khoảng cách hạt dày để chữ rõ nét

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 180) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            size: 1.5,
                            alpha: Math.random() * 0.5 + 0.5
                        });
                    }
                }
            }
        }

        // Tạo hình trái tim lung linh bằng hạt sáng
        function createHeartParticles() {
            particles = [];
            const scale = Math.min(width, height) / 38;
            const particleCount = 1200;

            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    targetX: width / 2 + x * scale,
                    targetY: height / 2 + y * scale,
                    size: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        function drawParticles() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            for (let p of particles) {
                p.x += (p.targetX - p.x) * 0.12;
                p.y += (p.targetY - p.y) * 0.12;

                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function showNextMessage() {
            if (msgIndex < messages.length) {
                createTextParticles(messages[msgIndex]);
                state = 'TEXT';
                msgIndex++;
                setTimeout(showNextMessage, 2600); // 2.6 giây đổi chữ 1 lần
            } else {
                createHeartParticles();
                state = 'HEART';
            }
        }

        function startSequence() {
            startBtn.style.display = 'none';
            initMatrix();
            state = 'MATRIX';

            setTimeout(() => {
                showNextMessage();
            }, 2000);
        }

        function loop() {
            if (state === 'MATRIX') {
                drawMatrix();
            } else if (state === 'TEXT' || state === 'HEART') {
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startSequence);
        loop();
    </script>
</body>
</html>
