<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Linh ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Màn hình nhắc xoay ngang màn hình */
        #rotate-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-notice svg {
            width: 60px;
            height: 60px;
            fill: #ffffff;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }

        #rotate-notice p {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 16px 38px;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 35px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        #start-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <svg viewBox="0 0 24 24">
            <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
        </svg>
        <p>Vui lòng xoay ngang thiết bị của bạn</p>
    </div>

    <button id="start-btn">Nhấn vào đây ❤️</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const rotateNotice = document.getElementById('rotate-notice');

        let width = window.innerWidth;
        let height = window.innerHeight;

        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            checkOrientation();
        }

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateNotice.style.display = 'flex';
            } else {
                rotateNotice.style.display = 'none';
            }
        }

        setupCanvas();
        window.addEventListener('resize', () => {
            setupCanvas();
            initMatrix();
            initSparkles();
        });

        // 1. Danh sách câu hiển thị & thời gian (Số 3, 2, 1 đếm chuẩn 1s)
        const timeline = [
            { text: "3", duration: 1000 },
            { text: "2", duration: 1000 },
            { text: "1", duration: 1000 },
            { text: "Anh thật sự thích em", duration: 2500 },
            { text: "Anh muốn yêu em nghiêm túc", duration: 2600 },
            { text: "Em đồng ý...", duration: 2200 },
            { text: "Làm người yêu anh nhé", duration: 2800 }
        ];

        let msgIndex = 0;
        let isRunning = false;
        let isHeartPhase = false;
        let pulseTime = 0;

        // 2. Ma trận số (Matrix Rain) chuẩn màu silver/trắng rơi liên tục
        let matrixDrops = [];
        const chars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ@#$%&*";

        function initMatrix() {
            const columns = Math.floor(width / 18);
            matrixDrops = [];
            for (let i = 0; i < columns; i++) {
                matrixDrops[i] = Math.random() * -50;
            }
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(220, 225, 235, 0.4)';
            ctx.font = '14px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * 18;
                const y = matrixDrops[i] * 18;

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // 3. Hiệu ứng Ngôi sao 4 cánh lấp lánh (✨ Sparkle Stars)
        let sparkles = [];
        function initSparkles() {
            sparkles = [];
            for (let i = 0; i < 60; i++) {
                sparkles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 6 + 3,
                    alpha: Math.random(),
                    speed: Math.random() * 0.03 + 0.01,
                    color: Math.random() > 0.3 ? '#ffffff' : '#ffc0cb'
                });
            }
        }

        // Vẽ ngôi sao 4 cánh lấp lánh chuẩn video
        function draw4PointStar(cx, cy, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.fillStyle = color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;

            ctx.beginPath();
            ctx.moveTo(cx, cy - size);
            ctx.quadraticCurveTo(cx, cy, cx + size, cy);
            ctx.quadraticCurveTo(cx, cy, cx, cy + size);
            ctx.quadraticCurveTo(cx, cy, cx - size, cy);
            ctx.quadraticCurveTo(cx, cy, cx, cy - size);
            ctx.fill();
            ctx.restore();
        }

        function drawSparkles() {
            for (let s of sparkles) {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                draw4PointStar(s.x, s.y, s.size, s.color, s.alpha);
            }
        }

        // 4. Các hạt ghép thành Chữ & Trái tim
        let particles = [];
        let heartOutlineParticles = [];
        let heartSparkleParticles = [];
        let isExploding = false;

        function createTextParticles(text) {
            particles = [];
            isExploding = false;

            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            const offCtx = offscreen.getContext('2d');

            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, width, height);

            let fontSize = Math.min(width / (text.length * 0.7), 65);
            if (text.length <= 2) fontSize = 120; // Số 3, 2, 1 to rõ

            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const step = Math.max(2, Math.floor(width / 240));

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 180) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            vx: 0,
                            vy: 0,
                            size: 1.8,
                            alpha: 1
                        });
                    }
                }
            }
        }

        // Khởi tạo Trái tim viền lấp lánh chuẩn như trong video
        function setupHeartPhase() {
            heartOutlineParticles = [];
            heartSparkleParticles = [];
            isHeartPhase = true;

            const scale = Math.min(width, height) / 30;
            const particleCount = 1200;

            // Dãy hạt tạo đường viền & độ dày trái tim
            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const offset = (Math.random() - 0.5) * 0.8;
                const x = 16 * Math.pow(Math.sin(t), 3) + offset;
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) + offset;

                heartOutlineParticles.push({
                    baseX: x * scale,
                    baseY: y * scale,
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }

            // Hạt ngôi sao 4 cánh nhấp nháy trên đường viền trái tim
            for (let i = 0; i < 40; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                heartSparkleParticles.push({
                    baseX: x * scale,
                    baseY: y * scale,
                    size: Math.random() * 5 + 3,
                    alpha: Math.random(),
                    speed: Math.random() * 0.04 + 0.02
                });
            }
        }

        function triggerDissolve() {
            isExploding = true;
            for (let p of particles) {
                p.vx = (Math.random() - 0.5) * 6;
                p.vy = (Math.random() - 0.5) * 6;
            }
        }

        function drawParticles() {
            if (!isHeartPhase) {
                for (let p of particles) {
                    if (!isExploding) {
                        p.x += (p.targetX - p.x) * 0.14;
                        p.y += (p.targetY - p.y) * 0.14;
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.035;
                    }

                    if (p.alpha > 0) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, p.alpha)})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            } else {
                pulseTime += 0.03;
                const beatScale = 1 + Math.sin(pulseTime) * 0.025; // Nhịp đập phập phồng nhẹ

                // 1. Vẽ các hạt viền Trái tim
                for (let hp of heartOutlineParticles) {
                    const targetX = width / 2 + hp.baseX * beatScale;
                    const targetY = height / 2 + hp.baseY * beatScale;

                    hp.x += (targetX - hp.x) * 0.1;
                    hp.y += (targetY - hp.y) * 0.1;

                    ctx.save();
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffffff';
                    ctx.fillStyle = `rgba(255, 255, 255, ${hp.alpha})`;
                    ctx.beginPath();
                    ctx.arc(hp.x, hp.y, hp.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 2. Vẽ các Ngôi sao lấp lánh ✨ đính trên viền trái tim
                for (let sp of heartSparkleParticles) {
                    const spX = width / 2 + sp.baseX * beatScale;
                    const spY = height / 2 + sp.baseY * beatScale;

                    sp.alpha += sp.speed;
                    if (sp.alpha > 1 || sp.alpha < 0) sp.speed = -sp.speed;

                    draw4PointStar(spX, spY, sp.size, '#ffffff', sp.alpha);
                }

                // 3. Hiển thị dòng chữ "Anh Yêu Linh" giữa trái tim
                ctx.save();
                let fontSize = Math.min(width / 14, 40);
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 18;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                ctx.fillStyle = '#ffffff';
                ctx.fillText("Anh Yêu Linh", width / 2, height / 2);
                ctx.restore();
            }
        }

        function processNextStep() {
            if (msgIndex < timeline.length) {
                const current = timeline[msgIndex];
                createTextParticles(current.text);
                msgIndex++;

                const dissolveTime = current.text.length <= 2 ? 120 : 380;

                setTimeout(() => {
                    triggerDissolve();
                    setTimeout(processNextStep, dissolveTime);
                }, current.duration - dissolveTime);
            } else {
                setupHeartPhase();
            }
        }

        function startSequence() {
            startBtn.style.display = 'none';
            isRunning = true;
            initMatrix();
            initSparkles();

            setTimeout(() => {
                processNextStep();
            }, 800);
        }

        function loop() {
            if (isRunning) {
                drawMatrix();
                drawSparkles();
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startSequence);
        loop();
    </script>
</body>
</html>
