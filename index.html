<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Linh ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #rotate-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-notice svg {
            width: 60px;
            height: 60px;
            fill: #fff;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }

        #rotate-notice p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
        }

        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        #start-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <svg viewBox="0 0 24 24">
            <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
        </svg>
        <p>Vui lòng xoay ngang thiết bị của bạn</p>
    </div>

    <button id="start-btn">Nhấn vào đây ❤️</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const rotateNotice = document.getElementById('rotate-notice');

        let width = window.innerWidth;
        let height = window.innerHeight;

        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            checkOrientation();
        }

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateNotice.style.display = 'flex';
            } else {
                rotateNotice.style.display = 'none';
            }
        }

        setupCanvas();
        window.addEventListener('resize', () => {
            setupCanvas();
            initMatrix();
        });

        // 1. Kịch bản câu chữ (Số 3, 2, 1 đếm đúng 1s)
        const timeline = [
            { text: "3", duration: 1000 },
            { text: "2", duration: 1000 },
            { text: "1", duration: 1000 },
            { text: "Anh thật sự thích em", duration: 2500 },
            { text: "Anh muốn yêu em nghiêm túc", duration: 2600 },
            { text: "Em đồng ý...", duration: 2300 },
            { text: "Làm người yêu anh nhé", duration: 2800 }
        ];

        let msgIndex = 0;
        let isRunning = false;
        let isHeartPhase = false;

        // 2. Matrix Rain Nền (màu trắng mờ)
        let matrixDrops = [];
        const matrixChars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ@#$%&*";

        function initMatrix() {
            const columns = Math.floor(width / 18);
            matrixDrops = [];
            for (let i = 0; i < columns; i++) {
                matrixDrops[i] = Math.random() * -50;
            }
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = '14px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                const x = i * 18;
                const y = matrixDrops[i] * 18;

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // 3. Hạt biến đổi chữ & Trái tim viền mã ký tự lấp lánh
        let particles = [];
        let heartCharParticles = [];
        let isExploding = false;

        function createTextParticles(text) {
            particles = [];
            isExploding = false;

            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            const offCtx = offscreen.getContext('2d');

            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, width, height);

            let fontSize = Math.min(width / (text.length * 0.7), 65);
            if (text.length <= 2) fontSize = 120;

            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const step = Math.max(2, Math.floor(width / 240));

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 180) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            vx: 0,
                            vy: 0,
                            size: 1.8,
                            alpha: 1
                        });
                    }
                }
            }
        }

        // Tạo Trái tim viền bằng ký tự/mã số nhấp nháy lấp lánh như video
        function setupHeartStage() {
            heartCharParticles = [];
            isHeartPhase = true;

            const scale = Math.min(width, height) / 32;
            const count = 550; // Số lượng vị trí ký tự tạo thành viền trái tim

            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                // Hàm trái tim toán học
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                // Độ lệch nhẹ tạo độ dày dặn cho viền trái tim
                const scatterX = (Math.random() - 0.5) * 0.6;
                const scatterY = (Math.random() - 0.5) * 0.6;

                heartCharParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    targetX: width / 2 + (x + scatterX) * scale,
                    targetY: height / 2 + (y + scatterY) * scale,
                    char: matrixChars.charAt(Math.floor(Math.random() * matrixChars.length)),
                    alpha: Math.random(),
                    twinkleSpeed: Math.random() * 0.08 + 0.02,
                    fontSize: Math.floor(Math.random() * 6) + 12
                });
            }
        }

        function triggerDissolve() {
            isExploding = true;
            for (let p of particles) {
                p.vx = (Math.random() - 0.5) * 6;
                p.vy = (Math.random() - 0.5) * 6;
            }
        }

        function drawParticles() {
            if (!isHeartPhase) {
                for (let p of particles) {
                    if (!isExploding) {
                        p.x += (p.targetX - p.x) * 0.14;
                        p.y += (p.targetY - p.y) * 0.14;
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.035;
                    }

                    if (p.alpha > 0) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, p.alpha)})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            } else {
                // Vẽ Viền Trái tim bằng các Mã số/Ký tự lấp lánh liên tục
                for (let hp of heartCharParticles) {
                    hp.x += (hp.targetX - hp.x) * 0.1;
                    hp.y += (hp.targetY - hp.y) * 0.1;

                    hp.alpha += hp.twinkleSpeed;
                    if (hp.alpha > 1 || hp.alpha < 0.2) {
                        hp.twinkleSpeed = -hp.twinkleSpeed;
                        // Thỉnh thoảng đổi ký tự để tạo hiệu ứng chạy mã sinh động
                        if (Math.random() > 0.6) {
                            hp.char = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                        }
                    }

                    ctx.save();
                    ctx.font = `bold ${hp.fontSize}px monospace`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(hp.alpha)})`;
                    ctx.fillText(hp.char, hp.x, hp.y);
                    ctx.restore();
                }

                // Vẽ dòng chữ "Anh Yêu Linh" phát sáng rõ nét giữa lòng trái tim
                ctx.save();
                let fontSize = Math.min(width / 14, 40);
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.fillText("Anh Yêu Linh", width / 2, height / 2);
                ctx.restore();
            }
        }

        function processNextStep() {
            if (msgIndex < timeline.length) {
                const current = timeline[msgIndex];
                createTextParticles(current.text);
                msgIndex++;

                const dissolveTime = current.text.length <= 2 ? 120 : 380;

                setTimeout(() => {
                    triggerDissolve();
                    setTimeout(processNextStep, dissolveTime);
                }, current.duration - dissolveTime);
            } else {
                setupHeartStage();
            }
        }

        function startSequence() {
            startBtn.style.display = 'none';
            isRunning = true;
            initMatrix();

            setTimeout(() => {
                processNextStep();
            }, 800);
        }

        function loop() {
            if (isRunning) {
                drawMatrix();
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startSequence);
        loop();
    </script>
</body>
</html>
