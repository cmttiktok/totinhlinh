<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lời Tỏ Tình Dành Cho Linh ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050005;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #rotate-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050005;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-notice svg {
            width: 60px;
            height: 60px;
            fill: #ff4d6d;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }

        #rotate-notice p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 16px 38px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(255, 75, 110, 0.3), rgba(255, 154, 162, 0.2));
            border: 1px solid rgba(255, 182, 193, 0.6);
            border-radius: 35px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 35px rgba(255, 77, 109, 0.7);
        }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <svg viewBox="0 0 24 24">
            <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
        </svg>
        <p>Vui lòng xoay ngang thiết bị của bạn ❤️</p>
    </div>

    <button id="start-btn">Nhấn vào đây ❤️</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const rotateNotice = document.getElementById('rotate-notice');

        let dpr = window.devicePixelRatio || 1;
        let width = window.innerWidth;
        let height = window.innerHeight;

        function setupCanvas() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            checkOrientation();
        }

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateNotice.style.display = 'flex';
            } else {
                rotateNotice.style.display = 'none';
            }
        }

        setupCanvas();
        window.addEventListener('resize', () => {
            setupCanvas();
            initMatrix();
            initSnowflakes();
        });

        // Kịch bản hiển thị câu chữ & đếm giây chuẩn 1s
        const timeline = [
            { text: "3", duration: 1000 },
            { text: "2", duration: 1000 },
            { text: "1", duration: 1000 },
            { text: "Anh thật sự thích em", duration: 2500 },
            { text: "Anh muốn yêu em nghiêm túc", duration: 2600 },
            { text: "Em đồng ý...", duration: 2300 },
            { text: "Làm người yêu anh nhé ❤️", duration: 2800 }
        ];

        let msgIndex = 0;
        let isRunning = false;
        let isHeartPhase = false;
        let heartBeatTimer = 0;

        // 1. Matrix Rain Nền (Màu hồng Neon mờ ảo & lãng mạn)
        let matrixDrops = [];
        const chars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ@#$%&*❤️";

        function initMatrix() {
            const columns = Math.floor(width / 18);
            matrixDrops = [];
            for (let i = 0; i < columns; i++) {
                matrixDrops[i] = Math.random() * -50;
            }
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 0, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 105, 180, 0.25)'; // Màu hồng Neon Matrix
            ctx.font = '14px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * 18;
                const y = matrixDrops[i] * 18;

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // 2. Hiệu ứng Bông Tuyết Lấp Lánh lung linh
        let snowflakes = [];
        function initSnowflakes() {
            snowflakes = [];
            const flakeCount = 50;
            for (let i = 0; i < flakeCount; i++) {
                snowflakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 3 + 1.5,
                    speedY: Math.random() * 0.7 + 0.3,
                    speedX: Math.random() * 0.6 - 0.3,
                    color: Math.random() > 0.4 ? '#ffffff' : '#ffb6c1'
                });
            }
        }

        function drawSnowflakes() {
            for (let flake of snowflakes) {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = flake.color;
                ctx.fillStyle = flake.color;
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                flake.y += flake.speedY;
                flake.x += flake.speedX;

                if (flake.y > height) {
                    flake.y = -10;
                    flake.x = Math.random() * width;
                }
            }
        }

        // 3. Hạt chữ & Trái tim tỏa sáng
        let particles = [];
        let heartParticles = [];
        let innerTextParticles = [];
        let isExploding = false;

        function createTextParticles(text) {
            particles = [];
            isExploding = false;

            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            const offCtx = offscreen.getContext('2d');

            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, width, height);

            let fontSize = Math.min(width / (text.length * 0.65), 65);
            if (text.length <= 2) fontSize = 130;

            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const step = Math.max(2, Math.floor(width / 240));

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 180) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            vx: 0,
                            vy: 0,
                            size: 1.8,
                            alpha: 1,
                            color: text.length <= 2 ? '#ff4d6d' : '#ffffff' // Số 3 2 1 màu đỏ hồng
                        });
                    }
                }
            }
        }

        // Tạo Trái tim màu Đỏ Hồng Neon lung linh + Nhịp đập nhẹ
        function setupHeartStage() {
            heartParticles = [];
            innerTextParticles = [];
            isHeartPhase = true;

            const scale = Math.min(width, height) / 32;
            const count = 1500;

            // 1. Viền và lòng trái tim
            for (let i = 0; i < count; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                // Phối màu đỏ, hồng neon và trắng lấp lánh
                let pColor = '#ff4d6d';
                if (Math.random() > 0.6) pColor = '#ff8fa3';
                if (Math.random() > 0.85) pColor = '#ffffff';

                heartParticles.push({
                    baseX: x * scale,
                    baseY: y * scale,
                    x: Math.random() * width,
                    y: Math.random() * height,
                    targetX: width / 2 + x * scale,
                    targetY: height / 2 + y * scale,
                    size: Math.random() * 2.3 + 1,
                    alpha: Math.random(),
                    twinkleSpeed: Math.random() * 0.06 + 0.02,
                    color: pColor
                });
            }

            // 2. Chữ "Anh Yêu Linh" phát sáng màu Trắng Ánh Hồng
            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            const offCtx = offscreen.getContext('2d');

            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, width, height);

            let fontSize = Math.min(width / 13, 45);
            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText("Anh Yêu Linh", width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const step = Math.max(2, Math.floor(width / 260));

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 180) {
                        innerTextParticles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            size: 1.8,
                            alpha: Math.random() * 0.5 + 0.5
                        });
                    }
                }
            }
        }

        function triggerDissolve() {
            isExploding = true;
            for (let p of particles) {
                p.vx = (Math.random() - 0.5) * 7;
                p.vy = (Math.random() - 0.5) * 7;
            }
        }

        function drawParticles() {
            if (!isHeartPhase) {
                for (let p of particles) {
                    if (!isExploding) {
                        p.x += (p.targetX - p.x) * 0.14;
                        p.y += (p.targetY - p.y) * 0.14;
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.035;
                    }

                    if (p.alpha > 0) {
                        ctx.save();
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = p.color;
                        ctx.fillStyle = p.color === '#ff4d6d' ? '#ff4d6d' : `rgba(255, 255, 255, ${Math.max(0, p.alpha)})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            } else {
                heartBeatTimer += 0.04;
                // Hiệu ứng phập phồng nhẹ theo nhịp tim
                const beatScale = 1 + Math.sin(heartBeatTimer) * 0.03;

                // Vẽ Trái tim Neon lấp lánh chuyển động
                for (let hp of heartParticles) {
                    const beatX = width / 2 + hp.baseX * beatScale;
                    const beatY = height / 2 + hp.baseY * beatScale;

                    hp.x += (beatX - hp.x) * 0.1;
                    hp.y += (beatY - hp.y) * 0.1;

                    hp.alpha += hp.twinkleSpeed;
                    if (hp.alpha > 1 || hp.alpha < 0.2) hp.twinkleSpeed = -hp.twinkleSpeed;

                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = hp.color;
                    ctx.fillStyle = hp.color;
                    ctx.globalAlpha = Math.abs(hp.alpha);
                    ctx.beginPath();
                    ctx.arc(hp.x, hp.y, hp.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Vẽ chữ "Anh Yêu Linh" nổi bật giữa trái tim
                for (let tp of innerTextParticles) {
                    tp.x += (tp.targetX - tp.x) * 0.1;
                    tp.y += (tp.targetY - tp.y) * 0.1;

                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff8fa3';
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(tp.x, tp.y, tp.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function processNextStep() {
            if (msgIndex < timeline.length) {
                const current = timeline[msgIndex];
                createTextParticles(current.text);
                msgIndex++;

                const dissolveTime = current.text.length <= 2 ? 150 : 400;

                setTimeout(() => {
                    triggerDissolve();
                    setTimeout(processNextStep, dissolveTime);
                }, current.duration - dissolveTime);
            } else {
                setupHeartStage();
            }
        }

        function startSequence() {
            startBtn.style.display = 'none';
            isRunning = true;
            initMatrix();
            initSnowflakes();

            setTimeout(() => {
                processNextStep();
            }, 800);
        }

        function loop() {
            if (isRunning) {
                drawMatrix();
                drawSnowflakes();
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startSequence);
        loop();
    </script>
</body>
</html>
