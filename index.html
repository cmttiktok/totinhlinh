<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lời Tỏ Tình Bất Ngờ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #rotate-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-notice svg {
            width: 60px;
            height: 60px;
            fill: #fff;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }

        #rotate-notice p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
        }

        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        #start-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <svg viewBox="0 0 24 24">
            <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
        </svg>
        <p>Vui lòng xoay ngang thiết bị của bạn</p>
    </div>

    <button id="start-btn">Nhấn vào đây ❤️</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const rotateNotice = document.getElementById('rotate-notice');

        let dpr = window.devicePixelRatio || 1;
        let width = window.innerWidth;
        let height = window.innerHeight;

        function setupCanvas() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            checkOrientation();
        }

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateNotice.style.display = 'flex';
            } else {
                rotateNotice.style.display = 'none';
            }
        }

        setupCanvas();
        window.addEventListener('resize', () => {
            setupCanvas();
            initMatrix();
            initSnowflakes();
        });

        // Danh sách thông điệp & thời gian hiển thị riêng cho từng câu (ms)
        const timeline = [
            { text: "3", duration: 1000 },
            { text: "2", duration: 1000 },
            { text: "1", duration: 1000 },
            { text: "Anh thật sự thích em", duration: 2500 },
            { text: "Anh muốn yêu em nghiêm túc", duration: 2600 },
            { text: "Em đồng ý...", duration: 2300 },
            { text: "Làm người yêu anh nhé ❤️", duration: 3000 }
        ];

        let msgIndex = 0;
        let isRunning = false;

        // 1. Matrix Rain Nền
        let matrixDrops = [];
        const chars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ@#$%&*";

        function initMatrix() {
            const columns = Math.floor(width / 18);
            matrixDrops = [];
            for (let i = 0; i < columns; i++) {
                matrixDrops[i] = Math.random() * -50;
            }
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.font = '15px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * 18;
                const y = matrixDrops[i] * 18;

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // 2. Hiệu ứng Bông Tuyết rơi (Snowflakes)
        let snowflakes = [];
        function initSnowflakes() {
            snowflakes = [];
            const flakeCount = 45;
            for (let i = 0; i < flakeCount; i++) {
                snowflakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 3 + 2, // Kích thước bông tuyết to rõ
                    speedY: Math.random() * 0.8 + 0.3,
                    speedX: Math.random() * 0.5 - 0.25,
                    alpha: Math.random() * 0.6 + 0.4
                });
            }
        }

        function drawSnowflakes() {
            ctx.fillStyle = '#ffffff';
            for (let flake of snowflakes) {
                ctx.save();
                ctx.globalAlpha = flake.alpha;
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                flake.y += flake.speedY;
                flake.x += flake.speedX;

                if (flake.y > height) {
                    flake.y = -10;
                    flake.x = Math.random() * width;
                }
            }
        }

        // 3. Hiệu ứng Hạt hội tụ & Tan biến (Dissolve Particle Effect)
        let particles = [];
        let isExploding = false;

        function createTextParticles(text) {
            particles = [];
            isExploding = false;

            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            const offCtx = offscreen.getContext('2d');

            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, width, height);

            // Tăng font chữ to hơn hẳn
            let fontSize = Math.min(width / (text.length * 0.65), 65);
            if (text.length <= 2) fontSize = 130; // Chữ số 3, 2, 1 rất to

            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const step = Math.max(2, Math.floor(width / 240));

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 180) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            vx: 0,
                            vy: 0,
                            size: 1.8,
                            alpha: 1
                        });
                    }
                }
            }
        }

        function createHeartParticles() {
            particles = [];
            isExploding = false;

            const scale = Math.min(width, height) / 34;
            const particleCount = 1400;

            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    targetX: width / 2 + x * scale,
                    targetY: height / 2 + y * scale,
                    vx: 0,
                    vy: 0,
                    size: Math.random() * 2 + 1,
                    alpha: 1
                });
            }
        }

        // Kích hoạt hiệu ứng vỡ hạt tan biến
        function triggerDissolve() {
            isExploding = true;
            for (let p of particles) {
                p.vx = (Math.random() - 0.5) * 6;
                p.vy = (Math.random() - 0.5) * 6;
            }
        }

        function drawParticles() {
            for (let p of particles) {
                if (!isExploding) {
                    p.x += (p.targetX - p.x) * 0.14;
                    p.y += (p.targetY - p.y) * 0.14;
                } else {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.035; // Mờ dần khi vỡ ra
                }

                if (p.alpha > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, p.alpha)})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function processNextStep() {
            if (msgIndex < timeline.length) {
                const current = timeline[msgIndex];
                createTextParticles(current.text);
                msgIndex++;

                // Chờ hiển thị xong thì kích hoạt hiệu ứng tan biến trước khi sang câu mới
                setTimeout(() => {
                    triggerDissolve();
                    setTimeout(processNextStep, 450); // Khoảng dừng ngắn cho hiệu ứng tan biến
                }, current.duration - 450);
            } else {
                createHeartParticles();
            }
        }

        function startSequence() {
            startBtn.style.display = 'none';
            isRunning = true;
            initMatrix();
            initSnowflakes();

            setTimeout(() => {
                processNextStep();
            }, 1200);
        }

        function loop() {
            if (isRunning) {
                drawMatrix();
                drawSnowflakes();
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startSequence);
        loop();
    </script>
</body>
</html>
