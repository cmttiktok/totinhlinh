<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Tỏ Tình Bất Ngờ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 15px 30px;
            font-size: 1.2rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <button id="start-btn">Nhấn vào đây ❤️</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initMatrix();
        });

        // Danh sách các thông điệp tỏ tình (Có thể chỉnh sửa tại đây)
        const messages = [
            "3",
            "2",
            "1",
            "Anh thật sự thích em",
            "Anh muốn yêu em nghiêm túc",
            "Em đồng ý...",
            "Làm người yêu anh nhé ❤️"
        ];

        let msgIndex = 0;
        let state = 'IDLE'; // IDLE, MATRIX, TEXT, HEART
        let matrixDrops = [];
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";

        function initMatrix() {
            const columns = Math.floor(width / 20);
            matrixDrops = [];
            for (let i = 0; i < columns; i++) {
                matrixDrops[i] = Math.random() * -100;
            }
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#fff';
            ctx.font = '16px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * 20;
                const y = matrixDrops[i] * 20;

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // Tạo hiệu ứng chữ phát sáng xếp bằng hạt
        let particles = [];
        function createTextParticles(text) {
            particles = [];
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#fff';
            let fontSize = Math.min(width / (text.length * 0.8), 60);
            if (text.length <= 2) fontSize = 100; // Dành cho đếm ngược 3,2,1
            
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, width / 2, height / 2);

            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Quét các điểm ảnh sáng để tạo particle
            const step = Math.max(1, Math.floor(width / 300));
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const index = (y * width + x) * 4;
                    if (data[index] > 200) { // Nếu pixel có màu sáng
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            size: Math.random() * 2 + 1,
                            alpha: Math.random()
                        });
                    }
                }
            }
        }

        // Tạo hình trái tim bằng hạt
        function createHeartParticles() {
            particles = [];
            const scale = Math.min(width, height) / 40;
            for (let i = 0; i < 1500; i++) {
                const t = Math.random() * Math.PI * 2;
                // Công thức toán học dựng hình trái tim
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    targetX: width / 2 + x * scale,
                    targetY: height / 2 + y * scale,
                    size: Math.random() * 2.5 + 1,
                    alpha: Math.random()
                });
            }
        }

        function drawParticles() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            for (let p of particles) {
                p.x += (p.targetX - p.x) * 0.1;
                p.y += (p.targetY - p.y) * 0.1;

                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function startSequence() {
            startBtn.style.display = 'none';
            initMatrix();
            state = 'MATRIX';

            // Sau 2.5 giây chạy nền Matrix thì bắt đầu chuyển lời chúc
            setTimeout(() => {
                showNextMessage();
            }, 2500);
        }

        function showNextMessage() {
            if (msgIndex < messages.length) {
                createTextParticles(messages[msgIndex]);
                state = 'TEXT';
                msgIndex++;
                setTimeout(showNextMessage, 2800); // 2.8 giây đổi câu 1 lần
            } else {
                createHeartParticles();
                state = 'HEART';
            }
        }

        function loop() {
            if (state === 'MATRIX') {
                drawMatrix();
            } else if (state === 'TEXT' || state === 'HEART') {
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startSequence);
        loop();
    </script>
</body>
</html>
