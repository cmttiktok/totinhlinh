<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Linh ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030005;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #rotate-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #030005;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-notice svg {
            width: 60px;
            height: 60px;
            fill: #ff4d6d;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }

        #rotate-notice p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        #start-btn {
            position: absolute;
            z-index: 10;
            padding: 16px 38px;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(255, 77, 109, 0.35), rgba(255, 143, 163, 0.2));
            border: 1px solid rgba(255, 182, 193, 0.6);
            border-radius: 35px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 35px rgba(255, 77, 109, 0.7);
        }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <svg viewBox="0 0 24 24">
            <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
        </svg>
        <p>Vui lòng xoay ngang thiết bị của bạn ❤️</p>
    </div>

    <button id="start-btn">Nhấn vào đây ❤️</button>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const rotateNotice = document.getElementById('rotate-notice');

        let width = window.innerWidth;
        let height = window.innerHeight;

        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            checkOrientation();
        }

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateNotice.style.display = 'flex';
            } else {
                rotateNotice.style.display = 'none';
            }
        }

        setupCanvas();
        window.addEventListener('resize', () => {
            setupCanvas();
            initMatrix();
        });

        // 1. Kịch bản lời tỏ tình (Đã kéo dài thời gian để vừa kịp tan biến chậm)
        const timeline = [
            { text: "3", duration: 1200, isNumber: true },
            { text: "2", duration: 1200, isNumber: true },
            { text: "1", duration: 1200, isNumber: true },
            { text: "Anh thật sự thích em", duration: 3000, isNumber: false },
            { text: "Anh muốn yêu em nghiêm túc", duration: 3100, isNumber: false },
            { text: "Em đồng ý...", duration: 2800, isNumber: false },
            { text: "Làm người yêu anh nhé ❤️", duration: 3300, isNumber: false }
        ];

        let msgIndex = 0;
        let isRunning = false;
        let isHeartPhase = false;
        let pulseTime = 0;
        let textGlowTimer = 0;

        // 2. Matrix Rain Nền
        let matrixDrops = [];
        const matrixChars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ@#$%&*❤️";

        function initMatrix() {
            const columns = Math.floor(width / 18);
            matrixDrops = [];
            for (let i = 0; i < columns; i++) {
                matrixDrops[i] = Math.random() * -50;
            }
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 0, 5, 0.22)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 182, 193, 0.28)';
            ctx.font = '14px monospace';

            for (let i = 0; i < matrixDrops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                const x = i * 18;
                const y = matrixDrops[i] * 18;

                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // Vẽ trái tim nhỏ
        function drawSmallHeart(cx, cy, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.fillStyle = color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;

            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(cx, cy + size * 0.3);
            ctx.bezierCurveTo(
                cx, cy, 
                cx - size / 2, cy - size / 2, 
                cx - size / 2, cy + topCurveHeight / 2
            );
            ctx.bezierCurveTo(
                cx - size / 2, cy + (size + topCurveHeight) / 2, 
                cx, cy + size, 
                cx, cy + size
            );
            ctx.bezierCurveTo(
                cx, cy + size, 
                cx + size / 2, cy + (size + topCurveHeight) / 2, 
                cx + size / 2, cy + topCurveHeight / 2
            );
            ctx.bezierCurveTo(
                cx + size / 2, cy - size / 2, 
                cx, cy, 
                cx, cy + size * 0.3
            );
            ctx.fill();
            ctx.restore();
        }

        // 3. Hạt hội tụ chữ
        let particles = [];
        let heartOutlineHearts = [];
        let isExploding = false;

        function createTextParticles(item) {
            particles = [];
            isExploding = false;

            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            const offCtx = offscreen.getContext('2d');

            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, width, height);

            let fontSize = Math.min(width / (item.text.length * 0.7), 65);
            if (item.isNumber) fontSize = 120;

            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(item.text, width / 2, height / 2);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const step = Math.max(2, Math.floor(width / 240));

            // Đổi màu: Số đếm màu Trắng (#ffffff), Lời chúc màu Hồng (#ff758f)
            const particleColor = item.isNumber ? '#ffffff' : '#ff758f';

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 180) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            targetX: x,
                            targetY: y,
                            vx: 0,
                            vy: 0,
                            size: item.isNumber ? 2.2 : 1.8,
                            alpha: 1,
                            color: particleColor
                        });
                    }
                }
            }
        }

        function setupHeartPhase() {
            heartOutlineHearts = [];
            isHeartPhase = true;

            const scale = Math.min(width, height) / 32;
            const count = 180;

            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                const scatterX = (Math.random() - 0.5) * 0.5;
                const scatterY = (Math.random() - 0.5) * 0.5;

                let hColor = '#ff4d6d';
                if (Math.random() > 0.45) hColor = '#ff8fa3';
                if (Math.random() > 0.8) hColor = '#ffffff';

                heartOutlineHearts.push({
                    baseX: (x + scatterX) * scale,
                    baseY: (y + scatterY) * scale,
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 8 + 7,
                    alpha: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: Math.random() * 0.05 + 0.02,
                    color: hColor
                });
            }
        }

        // Tốc độ tan biến nhẹ nhàng & chậm hơn
        function triggerDissolve() {
            isExploding = true;
            for (let p of particles) {
                p.vx = (Math.random() - 0.5) * 2.5; // Giảm vận tốc văng
                p.vy = (Math.random() - 0.5) * 2.5;
            }
        }

        function drawParticles() {
            if (!isHeartPhase) {
                for (let p of particles) {
                    if (!isExploding) {
                        p.x += (p.targetX - p.x) * 0.12;
                        p.y += (p.targetY - p.y) * 0.12;
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.015; // Giảm tốc độ mờ dần giúp hạt tan chậm hơn
                    }

                    if (p.alpha > 0) {
                        ctx.save();
                        ctx.shadowBlur = p.color === '#ffffff' ? 12 : 8;
                        ctx.shadowColor = p.color;
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            } else {
                pulseTime += 0.035;
                textGlowTimer += 0.04;

                const beatScale = 1 + Math.sin(pulseTime) * 0.03;

                for (let hp of heartOutlineHearts) {
                    const targetX = width / 2 + hp.baseX * beatScale;
                    const targetY = height / 2 + hp.baseY * beatScale;

                    hp.x += (targetX - hp.x) * 0.1;
                    hp.y += (targetY - hp.y) * 0.1;

                    hp.alpha += hp.twinkleSpeed;
                    if (hp.alpha > 1 || hp.alpha < 0.25) {
                        hp.twinkleSpeed = -hp.twinkleSpeed;
                    }

                    drawSmallHeart(hp.x, hp.y, hp.size, hp.color, hp.alpha);
                }

                // Chữ "Mãi Yêu Linh" thu nhỏ vừa vặn & Tỏa sáng lung linh
                ctx.save();
                let fontSize = Math.min(width / 18, 32); // Kích thước gọn gàng nằm trọn trong lòng trái tim
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Tạo nhiều lớp Glow sáng dịu lấp lánh
                const glowIntensity = 20 + Math.sin(textGlowTimer) * 12;
                ctx.shadowBlur = glowIntensity;
                ctx.shadowColor = '#ff4d6d';

                const gradient = ctx.createLinearGradient(
                    width / 2 - 80, height / 2, 
                    width / 2 + 80, height / 2
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.5, '#ffb6c1');
                gradient.addColorStop(1, '#ffffff');

                ctx.fillStyle = gradient;
                ctx.fillText("Mãi Yêu Linh", width / 2, height / 2);
                ctx.restore();
            }
        }

        function processNextStep() {
            if (msgIndex < timeline.length) {
                const current = timeline[msgIndex];
                createTextParticles(current);
                msgIndex++;

                // Thời gian chữ tan biến chuyển cảnh mượt mà
                const dissolveDuration = 600;

                setTimeout(() => {
                    triggerDissolve();
                    setTimeout(processNextStep, dissolveDuration);
                }, current.duration - dissolveDuration);
            } else {
                setupHeartPhase();
            }
        }

        function startSequence() {
            startBtn.style.display = 'none';
            isRunning = true;
            initMatrix();

            setTimeout(() => {
                processNextStep();
            }, 800);
        }

        function loop() {
            if (isRunning) {
                drawMatrix();
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startSequence);
        loop();
    </script>
</body>
</html>
